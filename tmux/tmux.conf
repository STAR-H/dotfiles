# =============================================================================
# Core / Terminal behavior
# =============================================================================

# Enable true color (RGB) support for xterm-256color based terminals
# Append instead of overwrite to preserve tmux built-in overrides
# neovim strikethrough need terminfo include smxx=\E[9m, rmxx=\E[29m,
# check by infocmp -1x tmux-256color > tmux-256color.info
if-shell '[[ "$(uname -s)" == "Darwin" ]]' \
    'set -g default-terminal "xterm-kitty"' \
    'set -g default-terminal "xterm-256color"'

if-shell '[ "$(uname -s)" = "Linux" ]' 'display-message "Linux detected" ; set -g default-command "exec zsh"'

set -as terminal-overrides ",*:Tc"

# Reduce delay for ESC key sequences (important for Vim/Neovim)
set -s escape-time 1

# Increase repeat timeout for repeatable key bindings (-r)
set -sg repeat-time 200

# Enable focus in/out events for applications (Vim, TUI tools)
set -s focus-events on

# =============================================================================
# Input / Interaction
# =============================================================================

# Increase scrollback history
set -g history-limit 5000

# Enable mouse support (scroll, select, resize)
set -g mouse on

# Change tmux prefix key
unbind C-b
set -g prefix `

# Allow applications to receive keys directly (tmux >= 3.2)
# Useful for nested shells, Vim terminal, SSH, etc.
set -g allow-passthrough on

# Reload tmux configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# =============================================================================
# Popup / Utilities
# =============================================================================

# Open a centered popup in the current pane's working directory
bind -r t display-popup -E  \
  -b rounded -w 50% -h 50% -x C -y C \
  -d "#{pane_current_path}"

# popup + fzf select window
bind-key w display-popup -b none -w 20% -h 20% -x C -y C -E "
tmux list-windows -F '#{?window_active,*, }#I #W' |
fzf --reverse --border=rounded --border-label="Windows" --info=hidden --prompt='> ' \
--color='border:#bd93f9,fg+:#f8f8f2:bold,bg+:#44475a,hl+:#bd93f9' |
awk '{print \$1}' |
xargs -r tmux select-window -t
"
# =============================================================================
# Window / Pane Display
# =============================================================================

# Start window and pane numbering from 1 (more human-friendly)

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

# Automatically rename windows based on the active program
setw -g automatic-rename on

# Update terminal title to reflect tmux state
set -g set-titles on

# Control display duration for pane indicators and status messages
set -g display-panes-time 800
set -g display-time 1000

# Activity monitoring (visual bell disabled)
set -g monitor-activity on
set -g visual-activity off

# Place the status bar at the top
set -g status-position top

# Use vi-style keys in copy mode and command mode
setw -g mode-keys vi


# Swap current window with previous/next window without changing focus
bind -n M-H if -F '#{>:#I,1}'                  'swap-window -d -t :-1'
bind -n M-L if -F '#{<:#I,#{session_windows}}' 'swap-window -d -t :+1'

# change windows
bind -n M-j 'select-window -t :+1'
bind -n M-k 'select-window -t :-1'

# =============================================================================
# Pane Navigation
# =============================================================================

# Prevent pane switching while a window is zoomed
# Display a message instead of silently failing
bind -r h if -F '#{window_zoomed_flag}'       \
  'display-message "Zoom active, exit first"' \
  'select-pane -L'

bind -r j if -F '#{window_zoomed_flag}'       \
  'display-message "Zoom active, exit first"' \
  'select-pane -D'

bind -r k if -F '#{window_zoomed_flag}'       \
  'display-message "Zoom active, exit first"' \
  'select-pane -U'

bind -r l if -F '#{window_zoomed_flag}'       \
  'display-message "Zoom active, exit first"' \
  'select-pane -R'

# Resize panes in larger steps for faster layout adjustments
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Join the current pane into another window
bind -r p join-pane -h
bind -r P join-pane -v

# Select last window
bind u select-window -l
# =============================================================================
# Copy Mode (Vi-style)
# =============================================================================

# Begin selection (visual mode)
bind -T copy-mode-vi v send -X begin-selection

# Toggle rectangular (block) selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection to buffer
bind -T copy-mode-vi y send -X copy-selection-no-clear

# Copy selection and exit copy mode
bind -T copy-mode-vi Y send -X copy-selection-and-cancel

# Cancel copy mode
bind -T copy-mode-vi Escape send -X cancel

# Disable default Space binding in copy mode
unbind -T copy-mode-vi Space

# Prevent exiting copy mode after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Disable mouse drag selection in copy mode
unbind -T copy-mode-vi mouseDrag1Pane

# Split panes while preserving the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"


# =============================================================================
# Layout Management
# =============================================================================

# Toggle between horizontal and vertical even layouts
# Store layout state in a window option
unbind Space
bind Space if -F '#{==:#{@layout_toggle},1}'              \
  'select-layout even-vertical; set -gw @layout_toggle 0' \
  'select-layout even-horizontal; set -gw @layout_toggle 1'

# =============================================================================
# Status Line / Dracula Theme
# =============================================================================

# Enable Dracula plugins
set -g @dracula-plugins "time cpu-usage ram-usage"

# CPU usage color scheme
set -g @dracula-cpu-usage-colors "pink dark_gray"

# Enable powerline-style separators
set -g @dracula-show-powerline true

# Left and right separators (Nerd Font required)
set -g @dracula-show-left-sep 
set -g @dracula-show-right-sep 

# Show window/session flags
set -g @dracula-show-flags true

# Refresh rate for Dracula status components (seconds)
set -g @dracula-refresh-rate 5

# Left status icon type and padding
# it can accept `session`, `smiley`, `window`, or any character.
set -g @dracula-show-left-icon session
# default is 1, it can accept any number and 0 disables padding.
set -g @dracula-left-icon-padding 0

# Improve pane border contrast
set -g @dracula-border-contrast true

# Hide timezone in the clock
set -g @dracula-show-timezone false

# Copy yanked text through tmux-yank without clearing selection
set -g @yank_action 'copy-pipe'

# Load plugins
run-shell "~/.config/tmux/plugins/dracula/dracula.tmux"
run-shell "~/.config/tmux/plugins/tmux-yank/yank.tmux"

